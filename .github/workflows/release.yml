name: Release

# Tag-driven release: builds the .debs and .rpms, then publishes them on a
# GitHub Release. The Raspberry Pi SD image is braemons/rig's, which installs
# these packages from the apt archive.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Re-running the workflow for an existing tag updates that release's assets.
on:
  push:
    tags: ['v*']
  # Manual runs are useful for exercising the build without cutting a tag.
  # They produce workflow artifacts but no release (see the `release` job's if:).
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keeps every job's artefact naming in step with the Makefile's output paths.
  DIST_DIR: dist

jobs:
  # ── .deb / .rpm ────────────────────────────────────────────────────────────
  # One job per target so a single arch failing does not hide the others, and
  # so the four run in parallel rather than serially inside one runner.
  packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [deb-amd64, deb-arm64, rpm-amd64, rpm-arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # The version is derived from the git tag, and the default shallow
          # fetch brings down no tags at all — `git describe` would fail.
          fetch-depth: 0

      # The arm64 builders cross-compile, but the rpm/deb tooling inside the
      # containers still runs some target-arch binaries under emulation.
      - name: Register binfmt handlers
        if: endsWith(matrix.target, 'arm64')
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      # Fails fast and visibly when the tag situation leaves the build without
      # a version, rather than aborting deep inside a Docker build.
      - name: Resolve version
        run: echo "building version $(make -s print-version)"

      - name: Build
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── Publish ───────────────────────────────────────────────────────────────
  release:
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \) \
               -exec cp -v {} release/ \;
          ls -lh release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          NOTES=$(cat <<'EOF'
          ## Installing

          **Raspberry Pi 5 (ready-to-flash image)** — the image is a whole rig
          and is released from https://github.com/braemons/rig/releases. It
          installs this release from the braemons apt archive.

          **From the apt archive** — `sudo apt install braemons-vstimd`, or
          `sudo apt install braemons` for a whole rig (see braemons/packages).

          **Debian / Ubuntu** — `sudo apt install ./braemons-vstimd_*_<arch>.deb`

          **Fedora / RHEL** — `sudo dnf install ./braemons-vstimd-*.<arch>.rpm`

          `braemons-gpiochip-daqd` is packaged separately; install it alongside
          vstimd on rigs that drive GPIO trigger lines.
          EOF
          )
          # A hyphen is semver's pre-release marker (v0.1.0-alpha1). Without
          # this, GitHub would badge an alpha as the project's Latest release.
          PRERELEASE=
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" --notes "$NOTES" --verify-tag $PRERELEASE
          fi
