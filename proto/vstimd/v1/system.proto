syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/color.proto";
import "vstimd/v1/stimuli/stimulus_type.proto";

// Render backend the server is running on.
enum RenderBackend {
  RENDER_BACKEND_UNSPECIFIED = 0;
  RENDER_BACKEND_DRM         = 1; // VK_KHR_display, bare-metal Linux
  RENDER_BACKEND_WINIT       = 2; // X11 / Wayland / Win32 window
}

// ── System mutations ──────────────────────────────────────────────────────────

// System command: set the background clear colour.
message SetBackgroundRequest {
  Color color = 1;
}

// System command: enter or exit deferred (frame-batched) mode.
// - active=true           → begin deferred mode (snapshot all live state)
// - active=false          → end deferred mode (schedule atomic flip on next vsync)
// - active=false, cancel=true → cancel deferred mode (discard pending changes)
message SetDeferredModeRequest {
  bool active = 1;
  bool cancel = 2;
}

// What a SetDeferredMode call did. Ending or cancelling deferred mode that was
// never begun is a no-op rather than an error — a client is allowed to say "off,
// whatever the state" — so the reply says which of the two happened, and whether
// anything is now waiting for the next vsync.
message SetDeferredModeResponse {
  // Deferred mode after the call: true only when it was just begun.
  bool deferred = 1;

  // A flip was queued and lands on the next vsync. False when the call ended
  // deferred mode that had never begun, or cancelled it (which discards).
  bool flip_scheduled = 2;

  // Deferred mode before the call, so a client can tell "I ended it" from
  // "it was not on".
  bool was_deferred = 3;

  // The frame the staged state lands on — the first frame drawn from it, so a
  // client can wait for exactly that frame rather than guessing at a vsync.
  // Zero when no flip is queued.
  uint64 flip_frame = 4;
}

// System command: remove all stimuli from the scene (except protected ones).
// Animations are left alone — see ClearAnimationsRequest and ClearAllRequest.
message ClearStimuliRequest {}

// System command: remove all animations, whatever their state. Running
// animations are cancelled; the stimuli they drive keep whatever value they
// were last given.
message ClearAnimationsRequest {}

// System command: clear the whole scene — every animation, then every stimulus
// except protected ones. Equivalent to ClearAnimations followed by
// ClearStimuli, in that order, so no animation outlives the stimuli it drives.
//
// Scene-wide settings are *not* touched: background and default colours, the
// photodiode patch and the VTL name map all survive.
message ClearAllRequest {}

// System command: enable or disable all stimuli (except protected ones).
message SetAllEnabledRequest {
  bool enabled = 1;
}

// ── Timing / synchronisation ──────────────────────────────────────────────────

// Block until the server has rendered at least `count` additional frames.
// The response carries the current frame_count and server_time_ns.
// Useful to confirm a deferred flip has been applied before querying state.
message WaitForFramesRequest {
  uint32 count = 1;
}

// Block until the server's monotonic clock reaches `server_time_ns` nanoseconds
// since server start (the same clock reported in Response.server_time_ns).
// Call GetServerTimeRequest first to read the current clock value.
message WaitUntilRequest {
  uint64 server_time_ns = 1;
}

// ── System queries ────────────────────────────────────────────────────────────

// System command: query server/display properties.
// Returns QueryServerInfoResponse in Response.body.
message QueryServerInfoRequest {}

// System command: list all stimuli in scene order.
// Returns ListStimuliResponse in Response.body.
message ListStimuliRequest {}

// ── System query response payloads ────────────────────────────────────────────

// Server version (semver).
message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// Response payload for QueryServerInfoRequest.
message QueryServerInfoResponse {
  uint32  width_px         = 1;   // display width
  uint32  height_px        = 2;   // display height
  // Nominal refresh rate of the display mode, in Hz. This is the rate to
  // convert durations against: it is a fixed property of the rig, so the same
  // script produces the same frame counts on every run. Use
  // `measured_frame_rate` to *monitor* the rig, never to compute with.
  float   frame_rate_hz       = 3;
  Color   background_color    = 4;
  RenderBackend backend       = 5;
  Version version             = 6;
  // Rolling mean of actual frame durations, in Hz. Telemetry: it jitters, so a
  // duration computed from it differs run to run.
  float   measured_frame_rate_hz = 7;
}

// One row in a ListStimuliResponse.
message StimulusEntry {
  uint32       handle        = 1;
  StimulusType stimulus_type = 2;
  bool         enabled       = 3;
  string       id            = 4; // stable UUID assigned at creation
  string       name          = 5; // human-readable label (empty if not set)
  // Conditions this stimulus is active in; empty = every condition.
  repeated uint32 condition_indices = 6;
}

// Response payload for ListStimuliRequest.
message ListStimuliResponse {
  repeated StimulusEntry entries = 1;
}

// ── Lifecycle (system target) ────────────────────────────────────────────────

// Request a clean server shutdown. The server finishes the current frame,
// tears down Vulkan and the VT, then exits. Equivalent to SIGTERM.
message ShutdownRequest {}

// ── Scene-config persistence (system target) ─────────────────────────────────
//
// A scene-config is one experiment: stimuli, animations, background, photodiode
// and the named VTL trigger lines. It lives in a project on the server, at
// <state-dir>/projects/<project>/scene-configs/<name>.config.json.
//
// Names are `[<project>/]<name>`; an unqualified name means the `default`
// project. Listing returns the same spelling back.

// List the scene-configs available on the server.
message ListSceneConfigsRequest {
  // "" = every project. Otherwise only this project's scene-configs.
  string project = 1;
}

message ListSceneConfigsResponse {
  // `<name>` inside `default`, `<project>/<name>` elsewhere. No extension.
  repeated string names = 1;
}

// Load a named scene-config from the server and apply it.
// additive=false: clear existing scene then restore (default).
// additive=true:  merge stimuli/animations; I/O config always fully replaced.
message LoadSceneConfigRequest {
  string name     = 1; // [<project>/]<name>
  bool   additive = 2;
}

// Upload a scene-config (as JSON) to the server.
// apply_now=true also applies it immediately after saving.
// overwrite=false returns an error if the name already exists.
message UploadSceneConfigRequest {
  string name      = 1; // [<project>/]<name>
  string json      = 2;
  bool   overwrite = 3;
  bool   apply_now = 4;
  bool   additive  = 5; // only used when apply_now=true
}

// Return the current scene + I/O config as a JSON string.
message RetrieveSceneConfigRequest {}

message RetrieveSceneConfigResponse {
  string json = 1;
}
