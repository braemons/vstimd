syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/stimuli/shapes.proto";
import "vstimd/v1/transform.proto";

// System command: create a rectangle stimulus.
// Returns the new handle in Response.handle and the UUID in Response.id.
//
// Every Create* request has the same three parts, in the same order: who it is,
// where it sits, what it is. The third part is the very `*Params` message
// QueryStimulusResponse reports back, so creating a stimulus and reading one
// speak one vocabulary — a client can round-trip a stimulus without a
// field-by-field translation layer in between, and a field added to RectParams
// reaches both directions at once.
message CreateRectRequest {
  StimulusIdentity identity = 1;
  // Centre and rotation. Absent → screen centre, 0°.
  Transform2D placement = 2;
  RectParams params = 3;
}

// Stimulus command: resize a Rect stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Rect.
message SetRectSizeRequest {
  float width_px = 1;
  float height_px = 2;
}

// Rect geometry and appearance. Used by both CreateRectRequest and
// QueryStimulusResponse.params, so the zero-means-default convention below is
// what a create reads and what a query reports.
message RectParams {
  float width_px = 1;  // full width  (0 → default 100)
  float height_px = 2; // full height (0 → default 100)
  // Full fill/outline/draw-mode state. Absent → fill from the scene
  // default_fill and outline from the scene default_outline. Present → each of
  // its own fields falls back the same way when unset, so a client may set only
  // `draw_mode`.
  //
  // Without this, creating an outlined rect took four round trips
  // (CreateRect + SetDrawMode + SetOutlineColor + SetOutlineWidth) and the
  // stimulus was on screen with the wrong appearance for three of them.
  ShapeAppearance appearance = 3;
}
