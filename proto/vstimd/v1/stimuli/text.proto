syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/vec2.proto";
import "vstimd/v1/color.proto";
import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/transform.proto";

// ── Text enumerations ─────────────────────────────────────────────────────────

// Bidi / shaping mode for text stimuli.
enum LanguageStyle {
  LANGUAGE_STYLE_UNSPECIFIED = 0; // treated as LTR (default)
  LANGUAGE_STYLE_LTR         = 1; // left-to-right
  LANGUAGE_STYLE_RTL         = 2; // right-to-left (e.g. Hebrew)
  LANGUAGE_STYLE_ARABIC      = 3; // Arabic: RTL + contextual glyph reshaping
}

// ── Text creation ─────────────────────────────────────────────────────────────

// System command: create a text stimulus.
// Returns the new handle in Response.handle and the UUID in Response.id.
//
// Text is laid out inside the bounding box defined by `params.box_size`, with
// word-wrap. The box is positioned at `placement.pos` (centre in pixel-space,
// Y-up). `params.anchor` controls which point of the box is placed there:
//   "center" (default), "top-left", "top-right", "bottom-left", "bottom-right"
//
// See CreateRectRequest for the shared identity/placement/params shape.
message CreateTextRequest {
  StimulusIdentity identity  = 1;
  Transform2D      placement = 2;
  TextParams       params    = 3;
}

// ── Text-specific mutations ───────────────────────────────────────────────────

// Stimulus command: replace the text content of a Text stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Text.
message SetTextRequest {
  string text = 1;
}

// Stimulus command: change the text colour of a Text stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Text.
message SetTextColorRequest {
  Color color = 1;
}

// ── Text query params ─────────────────────────────────────────────────────────

// Text content and styling. Used by both CreateTextRequest and
// QueryStimulusResponse.params, so the defaults noted here are what a create
// reads from an unset field and what a query reports back.
message TextParams {
  string        text           = 1;  // UTF-8 content
  string        font           = 2;  // font family name (e.g. "Open Sans")
  float         letter_height  = 3;  // cap-height in pixels (0 → default 32)
  // Named box_size, not size: `size` next to letter_height reads as the font
  // size, and the config field and the client argument are box-named already.
  Vec2          box_size       = 4;  // bounding box [width, height] (0 → 200×100)
  string        anchor         = 5;  // "center"|"top-left"|"top-right"|"bottom-left"|"bottom-right"
  Color         fill_color     = 6;  // background box fill (absent → transparent)
  Color         border_color   = 7;  // box border (absent → no border)
  bool          flip_horiz     = 8;  // mirror text horizontally
  LanguageStyle language_style = 9;  // bidi / shaping mode (default LTR)
  Color         text_color     = 10; // glyph colour (absent → white); also what
                                     // SetTextColorRequest sets
}
