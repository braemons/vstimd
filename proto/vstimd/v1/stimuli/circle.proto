syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/stimuli/shapes.proto";
import "vstimd/v1/transform.proto";

// System command: create a circle stimulus.
// Returns the new handle in Response.handle and the UUID in Response.id.
// See CreateRectRequest for the shared identity/placement/params shape.
message CreateCircleRequest {
  StimulusIdentity identity = 1;
  // A circle is rotationally symmetric, so `placement.rotation_deg` currently
  // changes nothing on screen. It is still accepted and stored rather than
  // special-cased away: SetOrientation already accepts a circle (it works on any
  // 2-D stimulus), so refusing a rotation only at creation would be the odd
  // behaviour, and the value becomes visible the moment a textured fill lands.
  Transform2D placement = 2;
  CircleParams params = 3;
}

// Stimulus command: set the radius of a Circle stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Circle.
message SetCircleRadiusRequest {
  float radius = 1;
}

message CircleParams {
  float radius = 1; // radius in pixels (0 → default 50)
  // See CreateRectRequest's RectParams.appearance for the fallback rules.
  ShapeAppearance appearance = 2;
}
