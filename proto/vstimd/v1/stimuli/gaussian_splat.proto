syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/transform.proto";

// ── Gaussian splatting ────────────────────────────────────────────────────────
//
// A prototype, kept in a file of its own so it can be added, disabled or removed
// without touching the rest of the 3-D surface. Everything splat-specific on
// this wire lives here; the shared files hold only the entries that must be
// there — one `StimulusType` value, one `StimulusParams` arm, one `Request` arm.

// A trained 3-D Gaussian splat scene (3DGS), loaded from a file on the server.
//
// Splats are drawn after every other 3-D stimulus, sorted back to front and
// blended; they are depth-tested against opaque 3-D stimuli but do not occlude
// them. Colours are baked in by training: no material, no lighting, and not a
// calibrated luminance. SetAlpha multiplies every splat's own opacity.
//
// Placement matters more than for a primitive: a trained scene has arbitrary
// units and, from COLMAP, a Y-down frame. Transform3D.scale sets centimetres per
// scene unit, and a 180° pitch usually turns a COLMAP scene upright.
//
// The file loads in the background; the stimulus draws nothing until it has.
message GaussianSplat3DParams {
  // Server-side path to a .ply (the 3DGS reference layout; only the view-
  // independent colour is used) or an antimatter15 .splat file. Interim: this
  // becomes an asset reference once the asset store exists. A missing,
  // unreadable or unrecognised file → INVALID_ARGUMENT, naming the problem.
  // (Not FILE_NOT_FOUND: that code means a scene-config.)
  string path = 1;
}

// System command. NOT_SUPPORTED when the display has no usable depth format.
message CreateGaussianSplat3DRequest {
  StimulusIdentity identity = 1;
  Transform3D placement = 2;
  GaussianSplat3DParams params = 3;
}
