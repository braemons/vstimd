syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/vec2.proto";
import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/stimuli/shapes.proto";
import "vstimd/v1/transform.proto";

// ── Polygon creation ──────────────────────────────────────────────────────────

// System command: create a polygon stimulus.
// Returns the new handle in Response.handle and the UUID in Response.id.
// See CreateRectRequest for the shared identity/placement/params shape.
message CreatePolygonRequest {
  StimulusIdentity identity = 1;
  // The centre the vertices are relative to, plus a rotation about it.
  Transform2D placement = 2;
  PolygonParams params = 3;
}

// ── Polygon-specific mutations ────────────────────────────────────────────────

// Stimulus command: replace all vertices of a Polygon stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Polygon.
message SetPolygonVerticesRequest {
  repeated Vec2 vertices = 1;
}

// ── Polygon geometry and appearance ───────────────────────────────────────────

message PolygonParams {
  // Pixel-space, Y-up, relative to the stimulus centre.
  repeated Vec2 vertices = 1;
  // When true the last vertex is implicitly connected back to the first,
  // forming a closed polygon. When false only the stroke outline is drawn and
  // the fill is silently ignored.
  bool close_shape = 2;
  // See CreateRectRequest's RectParams.appearance for the fallback rules.
  ShapeAppearance appearance = 3;
}
