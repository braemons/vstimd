syntax = "proto3";
package vstimd.v1;

// Known stimulus types; used in query responses and list results.
enum StimulusType {
  STIMULUS_TYPE_UNSPECIFIED = 0;
  STIMULUS_TYPE_RECT        = 1;
  STIMULUS_TYPE_CIRCLE      = 2;
  STIMULUS_TYPE_ELLIPSE     = 3;
  // 4–6 reserved for Wedge / Petal / Pixel when their renderers arrive
  STIMULUS_TYPE_BITMAP      = 7;
  STIMULUS_TYPE_SHADER      = 8;
  STIMULUS_TYPE_PARTICLE    = 9;
  STIMULUS_TYPE_GRATING     = 10;
  STIMULUS_TYPE_TEXT        = 11;
  STIMULUS_TYPE_POLYGON     = 12;
  // Random dot kinematogram. Not 9: STIMULUS_TYPE_PARTICLE means the old C++
  // CStimulusPart point cloud, which is a different thing that happens to be
  // made of dots.
  STIMULUS_TYPE_DOTS        = 13;
  // 20–29: 3-D types, placed in world space by Transform3D.
  STIMULUS_TYPE_CUBE_3D     = 20;
  STIMULUS_TYPE_SPHERE_3D   = 21;
  STIMULUS_TYPE_PLANE_3D    = 22;
  STIMULUS_TYPE_CORRIDOR_3D = 23;
}
