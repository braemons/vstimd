syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/color.proto";
import "vstimd/v1/stimuli/identity.proto";
import "vstimd/v1/transform.proto";

// ── Grating enumerations ──────────────────────────────────────────────────────

enum WaveformType {
  WAVEFORM_TYPE_UNSPECIFIED = 0;
  WAVEFORM_TYPE_SIN = 1;
  WAVEFORM_TYPE_SQR = 2;
  WAVEFORM_TYPE_SAW = 3;
  WAVEFORM_TYPE_TRI = 4;
}

enum MaskType {
  MASK_TYPE_UNSPECIFIED = 0;
  MASK_TYPE_NONE = 1;
  MASK_TYPE_CIRCLE = 2;
  MASK_TYPE_GAUSS = 3;
  MASK_TYPE_HANN = 4;       // cosine bell: 0.5*(1+cos(π·r/R)), tapers from centre to edge
  MASK_TYPE_RAISED_COS = 5; // Tukey window: flat in inner 80%, raised-cosine taper in outer 20%
}

// ── Grating creation ──────────────────────────────────────────────────────────

// System command: create a grating stimulus.
// Returns the new handle in Response.handle.
//
// The grating is rendered analytically in a fragment shader over a rectangular
// patch. The rotation orients the stripes, not the patch — see `placement`.
//
// The carrier oscillates between fore_color (at +1) and back_color (at -1),
// modulated by contrast.  At contrast=1: peak pixel = fore_color, trough = back_color.
// At contrast=0: all pixels = mix(back_color, fore_color, 0.5).
message CreateGratingRequest {
  StimulusIdentity identity  = 1;
  // `placement.rotation_deg` is the stripe orientation: 0° = vertical stripes
  // varying along X, 90° = horizontal stripes varying along Y. It is the same
  // property SetOrientation sets, which is why it lives in the placement rather
  // than in GratingParams.
  Transform2D      placement = 2;
  GratingParams    params    = 3;
}

// ── Grating-specific mutations ────────────────────────────────────────────────

// Stimulus command: set the phase of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingPhaseRequest {
  float phase = 1;  // [0, 1]; wraps automatically
}

// Stimulus command: set the spatial frequency of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingSfRequest {
  float sf = 1;  // cycles/pixel
}

// Stimulus command: set the contrast of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingContrastRequest {
  float contrast = 1;  // [0, 1]
}

// Stimulus command: set the waveform of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingWaveformRequest {
  WaveformType waveform = 1;
}

// Stimulus command: set the aperture mask of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingMaskRequest {
  MaskType mask = 1;
}

// Stimulus command: set the drift speed of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingDriftSpeedRequest {
  float speed = 1;  // cycles/second; negative reverses direction
}

// Stimulus command: decouple drift direction from stripe orientation.
// When decoupled is false (default) drift follows grating orientation.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingDriftDecoupledRequest {
  bool decoupled = 1;
}

// Stimulus command: set the drift direction when not coupled to grating orientation.
// Has no effect when drift_coupled is true.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingDriftAngleRequest {
  float angle_deg = 1;  // degrees CCW
}

// Stimulus command: set the peak (foreground) colour of a Grating stimulus.
// The colour's own alpha applies; the shared per-stimulus opacity (SetAlpha)
// scales it.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingForeColorRequest {
  Color fore_color = 1;
}

// Stimulus command: set the trough (background) colour of a Grating stimulus.
// Returns WRONG_STIMULUS_TYPE if the handle is not a Grating.
message SetGratingBackColorRequest {
  Color back_color = 1;
}

// ── Grating query params ──────────────────────────────────────────────────────

// Grating geometry and carrier. Used by both CreateGratingRequest and
// QueryStimulusResponse.params, so the zero-means-default convention noted here
// is what a create reads and what a query reports.
//
// No `angle`: the stripe orientation is the stimulus rotation, and travels in
// the placement — see CreateGratingRequest.placement.
message GratingParams {
  float        width           = 1;  // full width in pixels  (0 → default 200)
  float        height          = 2;  // full height in pixels (0 → default 200)
  float        sf              = 3;  // spatial frequency in cycles/pixel (0 → default 0.05)
  float        phase           = 4;  // static phase offset [0, 1] (default 0)
  float        contrast        = 5;  // contrast in [0, 1] (0 → default 1)
  WaveformType waveform        = 6;
  MaskType     mask            = 7;
  float        mask_param      = 8;
  float        drift_speed     = 9;
  bool         drift_decoupled = 10;
  float        drift_angle     = 11;
  Color        fore_color      = 12; // peak colour (carrier = +1)
  Color        back_color      = 13; // trough colour (carrier = −1)
  // 14 was `opacity`: read it from QueryStimulusResponse.opacity instead.
  reserved 14;
}
