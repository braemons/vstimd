syntax = "proto3";
package vstimd.v1;

import "vstimd/v1/conditions.proto";

import "vstimd/v1/vtl.proto";

// ── State enum ────────────────────────────────────────────────────────────────

// Lifecycle state of an animation.
enum AnimationState {
  ANIMATION_STATE_IDLE    = 0;  // created but not yet armed
  ANIMATION_STATE_ARMED   = 1;  // waiting for a trigger (or for Armed→Running)
  ANIMATION_STATE_RUNNING = 2;  // actively executing
  ANIMATION_STATE_DONE    = 3;  // completed; will not fire again until re-armed
}

// ── Animation body messages ───────────────────────────────────────────────────
// One message per animation variant; embedded in CreateAnimationRequest.body.
// stimuli are specified once in CreateAnimationRequest.stimuli, not here.

// Mirror stimulus enabled state to the level of a trigger line. The handle's
// kind selects the input or output line to follow.
message CoupleVisibilityToTriggerLine {
  VirtualTriggerLineHandle trigger  = 1;
  // ACTIVE_HIGH = enable while the trigger is HIGH, ACTIVE_LOW = while LOW.
  VtlPolarity              polarity = 2;
}

// Set stimulus enabled once when a trigger edge fires. The handle's kind
// selects the input or output line to watch.
message EnableOnTriggerEdge {
  VirtualTriggerLineHandle trigger = 1;
  VtlEdge                  edge    = 2;
  bool                     enabled = 3;
}

// Enable stimuli for duration_frames.
message FlashForNFrames {
  uint32 duration_frames = 1;
}

// Flicker stimuli on/off.
message FlickerForNFrames {
  uint32          on_frames     = 1;
  uint32          off_frames    = 2;
  optional uint32 total_frames  = 3; // absent = run forever
  bool            start_on_phase = 4; // true (default) = start in the on-phase
}

// Set stimulus position every frame from an input device: its first two axes,
// both absolute, in pixels after the rig-config scale, plus the offsets.
// shm_name names a rig-config input device, by its name or its segment.
// INVALID_ARGUMENT if no such device, or its first two axes are not absolute.
message ExternalPosition2D {
  string shm_name  = 1; // e.g. "eye_tracker" or "/vstimd_gaze"
  float  x_offset_px = 2;
  float  y_offset_px = 3;
}

// Move stimulus along a preloaded sequence of 2-D positions, one per frame.
// x and y must have the same length; the animation completes when all positions
// have been played. Each coordinate is in screen units (same as SetPosition).
message MoveAlongPath2D {
  repeated float x_px = 1;
  repeated float y_px = 2;
}

// Move stimulus along piecewise-linear waypoints at a constant speed.
// x and y must have the same length and at least 2 entries. Speed is in
// screen units per second; the server converts to frame steps using the
// measured display frame rate.
message MoveAlongSegments2D {
  repeated float x_px             = 1;
  repeated float y_px             = 2;
  float          speed_px_per_sec = 3;
}

// Move the camera straight ahead at a constant speed, along its horizontal
// forward direction (pitch tilts the view but does not fly the camera into the
// floor). Never finishes on its own. Requires target.camera.
//
// With wrap_period_cm > 0 the camera's z wraps into [0, wrap_period_cm): an
// endless corridor is periodic geometry the camera circulates through. The true
// distance is QueryAnimationResponse.distance_travelled_cm, which never wraps.
//
// Speed changes go through SetNavSpeedRequest. It is not a per-frame channel —
// driving the camera from a treadmill is an input-device animation.
message LinearNav3D {
  float speed_cm_per_s = 1;  // negative moves backwards; ignored with a source
  float wrap_period_cm = 2;  // (0 → no wrapping)
  // Drive the speed from an input device instead: a rate axis is a speed in
  // cm/s over real frame time (dropped frames included), a cumulative axis moves
  // the camera by exactly its change. An absolute axis is INVALID_ARGUMENT.
  AxisRef source = 3;
}

// One axis of a rig-config input device, by name.
message AxisRef {
  string device = 1;
  string axis = 2;
}

// What an AxisMap drives.
enum TransformChannel {
  TRANSFORM_CHANNEL_UNSPECIFIED = 0;
  // Position: pixels on a 2-D stimulus, cm on a 3-D stimulus or the camera.
  TRANSFORM_CHANNEL_POS_X = 1;
  TRANSFORM_CHANNEL_POS_Y = 2;
  TRANSFORM_CHANNEL_POS_Z = 3;
  // Degrees. YAW is a 2-D stimulus' rotation.
  TRANSFORM_CHANNEL_YAW = 4;
  TRANSFORM_CHANNEL_PITCH = 5;
  TRANSFORM_CHANNEL_ROLL = 6;
  // 3-D stimuli only.
  TRANSFORM_CHANNEL_SCALE_X = 7;
  TRANSFORM_CHANNEL_SCALE_Y = 8;
  TRANSFORM_CHANNEL_SCALE_Z = 9;
  TRANSFORM_CHANNEL_SCALE_UNIFORM = 10;
  // Along the camera's horizontal forward / rightward direction, cm. Camera
  // target only, and rate or cumulative axes only.
  TRANSFORM_CHANNEL_FORWARD = 11;
  TRANSFORM_CHANNEL_STRAFE = 12;
}

// One device axis driving one channel. The axis' semantic decides how: absolute
// sets the channel, cumulative adds its change, rate adds value × frame time.
message AxisMap {
  string axis = 1;
  TransformChannel channel = 2;
  float gain = 3;                // device units → px, cm or degrees
  float deadzone = 4;            // absolute and rate values within ±deadzone read 0
  bool invert = 5;
  optional float clamp_min = 6;  // both or neither
  optional float clamp_max = 7;
  float wrap = 8;                // wrap the channel into [0, wrap); 0 → none
}

// Map input-device axes onto the target's transform every frame — stimuli or
// the camera. Never finishes on its own. INVALID_ARGUMENT for an unknown device
// or axis, a camera-only channel without a camera target, an absolute axis on
// FORWARD / STRAFE, or a scale channel on the camera.
message DeviceDrivenTransform {
  string device = 1;
  repeated AxisMap axes = 2;
}

// ── What an animation drives ──────────────────────────────────────────────────

// The set of stimuli an animation drives. Every animation type fans out over
// this list; an empty list is accepted and simply drives nothing.
message AnimationStimuli {
  repeated uint32 handles = 1;
}

// The thing an animation drives.
//
// A oneof rather than a bare `repeated uint32` because the stimulus list is not
// the only plausible target — the 3-D camera is a scene object one would want to
// move on a trigger, with the same arming, cancelling and done-signalling as any
// other animation (dev/3D_ROADMAP.md §11.1). Adding that arm costs one field
// number and no break here.
//
// The camera is not a general-purpose target. It takes only the animations that
// move a camera — LinearNav3D today. The visibility kinds have nothing to act
// on, and the 2-D motion kinds move in pixels, which mean nothing in world
// centimetres. Any other pairing, and the ENABLE / DISABLE / RESTORE_VISIBILITY
// action bits on a camera animation, are INVALID_ARGUMENT at create time.
// The scene's 3-D camera. No fields: there is one.
message AnimationCamera {}

message AnimationTarget {
  oneof target {
    AnimationStimuli stimuli = 1;
    AnimationCamera camera = 2;
  }
}

// ── Animation management ──────────────────────────────────────────────────────

// start_action_mask bit values — applied when animation transitions Armed → Running:
//   0x02  ENABLE                    — enable stimuli at start
//   0x04  TOGGLE_PHOTODIODE         — toggle the photodiode indicator at start
//   0x08  START_ACTION_TRIGGER_LINE — pulse start_action_trigger_line for one frame at start
//
// final_action_mask bit values — applied when animation completes:
//   0x01  DISABLE           — disable stimuli on completion
//   0x02  REARM             — return to ARMED on completion, so the animation waits for
//                             its start_trigger again and fires on every edge instead of
//                             only the first. With no start_trigger this is RESTART, and
//                             RESTART wins if both bits are set.
//   0x04  TOGGLE_PHOTODIODE — toggle the photodiode indicator on completion
//   0x08  FINAL_ACTION_TRIGGER_LINE — pulse final_action_trigger_line for one frame on completion
//   0x10  RESTART                   — restart the animation immediately on completion,
//                                     without waiting for start_trigger again
//   0x20  REVERSE                   — reserved
//   0x40  RESTORE_VISIBILITY        — restore `enabled` to its value at animation start.
//                             Visibility only: an animation that moved the stimulus leaves
//                             it where the motion ended.
//   0x80  END_DEFERRED              — call end_deferred_mode on completion
//  0x100  DONE_LEVEL                — drive final_action_level_line HIGH on completion and
//                                     leave it there (cleared when the animation next
//                                     starts). Answers "has it finished since it last
//                                     started?" at any time; FINAL_ACTION_TRIGGER_LINE marks
//                                     the instant instead. Both may be set, on separate lines.
message CreateAnimationRequest {
  string name              = 1;
  uint32 final_action_mask = 2;
  // Required when FINAL_ACTION_TRIGGER_LINE (0x08) is set; the output line to pulse.
  VirtualTriggerLineHandle final_action_trigger_line = 3;
  // Required when DONE_LEVEL (0x100) is set; the output line to hold HIGH.
  VirtualTriggerLineHandle final_action_level_line = 20;
  // Optional: if set, the animation waits for this edge before starting. The
  // handle's kind selects an input or output line — an output edge lets one
  // animation start another entirely inside the server (see the intra-server
  // one-frame reaction described in vtl_state.rs).
  VirtualTriggerLineHandle start_trigger = 4;
  VtlEdge                  start_edge    = 5;
  // Optional: if set, this edge cancels the animation while it is Armed or
  // Running. Same wiring as start_trigger, including input-or-output kind.
  VirtualTriggerLineHandle cancel_trigger = 9;
  VtlEdge                  cancel_edge    = 16;
  // Actions applied when the animation is cancelled (edge or software command),
  // independent of final_action. Bit values (mirror final_action_mask; RESTART /
  // REVERSE do not apply — cancel is always terminal):
  //   0x01  DISABLE                    — disable stimuli on cancel
  //   0x04  TOGGLE_PHOTODIODE          — toggle the photodiode indicator on cancel
  //   0x08  CANCEL_ACTION_TRIGGER_LINE — pulse cancel_action_trigger_line for one frame
  //   0x40  RESTORE_VISIBILITY              — restore user_enabled captured at start (Running only)
  //   0x80  END_DEFERRED               — end deferred mode on cancel
  // 0 (default) = hard abort: leave visibility as-is.
  uint32                   cancel_action_mask = 17;
  // Required when CANCEL_ACTION_TRIGGER_LINE (0x08) is set; the output line to pulse.
  VirtualTriggerLineHandle cancel_action_trigger_line = 19;
  // What this animation drives (shared across all body types). Field 6 was a
  // bare `repeated uint32 stimuli`; it is reserved rather than reused.
  AnimationTarget          target        = 21;
  reserved 6;
  // Actions applied when animation transitions Armed → Running (see bit values above).
  uint32                   start_action_mask = 7;
  // Required when START_ACTION_TRIGGER_LINE (0x08) is set; the output line to pulse.
  VirtualTriggerLineHandle start_action_trigger_line = 8;

  oneof body {
    CoupleVisibilityToTriggerLine couple_visibility_to_trigger_line = 10;
    EnableOnTriggerEdge enable_on_trigger_edge = 11;
    FlashForNFrames    flash_for_n_frames    = 12;
    FlickerForNFrames  flicker_for_n_frames  = 13;
    MoveAlongPath2D    move_along_path_2d    = 14;
    MoveAlongSegments2D move_along_segments_2d = 15;
    ExternalPosition2D external_position_2d  = 18;
    LinearNav3D        linear_nav_3d         = 22;
    DeviceDrivenTransform device_driven_transform = 23;
  }
}

message ArmAnimationRequest    { uint32 handle = 1; }
message DisarmAnimationRequest { uint32 handle = 1; }
// Cancel an animation: applies its cancel_action_mask (DISABLE / RESTORE_VISIBILITY /
// trigger-line pulse / photodiode), releases any anim_enabled hold, and ends in
// DONE. Unlike disarm (which just returns to IDLE), cancel is terminal; an empty
// cancel_action_mask is a hard abort that leaves visibility as-is.
message CancelAnimationRequest { uint32 handle = 1; }
message DeleteAnimationRequest { uint32 handle = 1; }
message QueryAnimationRequest  { uint32 handle = 1; }
message ListAnimationsRequest  {}

message AnimationInfo {
  uint32         handle    = 1;
  string         name      = 2;
  AnimationState state     = 3;
  string         type_name = 4;
  // Conditions this animation is active in; empty = every condition.
  repeated uint32 condition_indices = 5;
  // False while the active condition excludes this animation, which then does
  // not advance.
  bool condition_enabled = 6;
}

// Full animation configuration plus current state.
message QueryAnimationResponse {
  uint32                 handle = 1;
  AnimationState         state  = 2;
  CreateAnimationRequest params = 3;
  // Canonical animation-type tag — same string as AnimationInfo.type_name and the
  // serde config-file enum tag (the Rust variant name). Clients pass it through.
  string                 type_name = 4;
  // Conditions this animation is active in; empty = every condition.
  repeated uint32        condition_indices = 5;
  // What a condition switch does to it.
  ConditionAction        condition_action = 6;
  // False while the active condition excludes it, which stops it advancing.
  bool                   condition_enabled = 7;
  // LinearNav3D: net distance moved since the animation last started, cm. Never
  // wrapped, so it is the number to log. Zero for every other kind.
  double                 distance_travelled_cm = 8;
}

// Change a LinearNav3D animation's speed, effective next frame. For scripted
// changes ("now run at 20 cm/s"), not a per-frame control loop.
message SetNavSpeedRequest {
  uint32 handle = 1;
  float speed_cm_per_s = 2;
}

message ListAnimationsResponse {
  repeated AnimationInfo animations = 1;
}
