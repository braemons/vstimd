# vstimd rig-config — /etc/braemons/vstimd-rig-config.toml
#
# This file configures hardware-specific behaviour that does not change between
# experiments.  Experiment-level settings (stimuli, named VTL lines) go in the
# stim-config passed via --config.
#
# All settings are optional; uncomment and adjust as needed.  The values shown
# are the built-in defaults.
#
# Board-specific examples (with GPIO line numbers pre-filled) are in:
#   /usr/share/braemons/vstimd/
#     jetson-orin-nano.toml
#     raspberry-pi-5.toml
#     raspberry-pi-4.toml
#
# To start with a board example:
#   cp /usr/share/braemons/vstimd/jetson-orin-nano.toml \
#      /etc/braemons/vstimd-rig-config.toml

# ── VTL shared memory ─────────────────────────────────────────────────────────
# [vtl]
# # POSIX shared-memory name — must start with '/'.
# # Must match shm_name in /etc/braemons/gpiochip-daqd-config.toml.
# shm_name = "/vstimd_vtl"
#
# # Number of 64-bit input banks.  Total input bits = num_input_banks × 64.
# # Increase for rigs with more than 64 GPIO inputs.
# num_input_banks = 1
#
# # Number of 64-bit output banks.  Total output bits = num_output_banks × 64.
# num_output_banks = 1
#
# # Vblank trigger: one output bit that vstimd pulses HIGH immediately after
# # each vblank wait and LOW after the GPU command buffer is submitted.
# # The pulse width equals vstimd's per-frame GPU work time (~0.1–1 ms).
# # Useful for aligning external DAQ timestamps to frame boundaries.
# # Pick a bit not used by any gpiochip-daqd [[outputs]] entry.
# [vtl.vblank]
# bank = 0
# bit  = 63

# ── Display ────────────────────────────────────────────────────────────────────
# [display]
#
# Force a specific render backend, bypassing DISPLAY/WAYLAND_DISPLAY-based
# auto-detection — useful when vstimd is launched by systemd with no
# --evdi/--null flag in ExecStart=. "auto" (default) picks desktop (winit) on
# a desktop session, DRM/console otherwise. Other values: "drm", "desktop",
# "null", "evdi" (direct-KMS DisplayLink presentation, no compositor —
# auxiliary/status display only, not for stimulus timing; see
# docs/developer/platform-notes.md). --null and --evdi on the command line
# still override this.
# backend = "auto"
#
# Preferred display mode (DRM/console mode only).  Omit to accept the
# display's EDID preferred mode.  Not yet applied — wiring into DRM mode
# selection is a planned feature.
# width      = 1920
# height     = 1080
# refresh_hz = 60.0
#
# Scale factor for the egui overlay UI (both desktop and DRM). Increase on
# high-DPI displays (e.g. 4K) where the overlay text/controls are too small.
# Overridable with --overlay-scale.
# overlay_scale = 1.0
#
# Vblank clock source (DRM/console mode only). "auto" (default) tries
# DRM_IOCTL_WAIT_VBLANK, then VK_EXT_display_control, then VK_KHR_present_wait,
# then GPU-completion timestamps. Auto-detection can't predict every GPU/driver
# combination — if a clock source that passes vstimd's own startup check still
# fails once running, pin a specific source here instead: vstimd will use
# exactly that source, or fail loudly at startup (with a clear error naming
# this file) if it isn't available, rather than silently trying alternatives.
# Overridable with --preferred-clock-source.
# Valid values: "auto", "drm_vblank", "vk_display_control", "present_wait",
# "gpu_completion".
# clock = "auto"

# ── Startup scene ────────────────────────────────────────────────────────────
# Load a scene at boot so the rig comes up in a known state with no client
# attached.  Overridden by the --config <path> CLI flag.  Configs live in
# --config-dir (default /var/lib/braemons/vstimd, or ~/.local/braemons/vstimd
# if that is not writable).
#
# [startup]
# # Named config (in --config-dir) to load at boot.  The literal "last" loads
# # the auto-saved last-session slot (see save_on_quit).  Omit or "" = empty scene.
# load_config = "center_target"
#
# # On graceful shutdown, save the current scene twice: overwrite the
# # last-session slot (restored next boot via load_config = "last") AND write a
# # timestamped archive vstimd_<YYYYMMDDTHHMMSSZ>.config.json for history.
# # Archives are never pruned; vstimd logs a warning past 500 in one dir.
# save_on_quit = false

# ── Thread scheduling ─────────────────────────────────────────────────────────
# CPU affinity and real-time priority for vstimd's render/vblank thread.
#
# render_rt_prio defaults to 55 (SCHED_FIFO) even with no [scheduling] block:
# above normal work, but below gpiochip-daqd's output thread (60) so trigger
# output still wins if they share a core.  Set 0 to stay on SCHED_OTHER.
# Needs CAP_SYS_NICE (the systemd unit has it); without it vstimd logs a
# warning, shows the failure in the overlay's System panel, and keeps running.
#
# render_cpu_core is NOT set by default — which core to pin to depends on the
# rig, so vstimd never guesses.  Omit to let the OS schedule on any core.
#
# [scheduling]
# render_cpu_core = 3
# render_rt_prio  = 55
