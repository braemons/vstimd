[package]
name = "vstimd"
# Sentinel inherited from the workspace; the shipped version comes from the git
# tag. See [workspace.package] in the root Cargo.toml.
version.workspace = true
edition = "2024"
description = "Visual stimulus display server for neuroscience experiments"
license = "AGPL-3.0-only"
repository = "https://github.com/braemons/vstimd"

[features]
default = ["web"]
# Embedded HTTP + WebSocket control surface for the browser UI. Disable with
# `--no-default-features` to drop axum/futures-util and compile out src/web.
web = ["dep:axum", "dep:futures-util", "tokio/net", "tokio/macros"]
# Bake the built React UI (client/web/dist) into the binary and serve it at `/`.
# Requires the frontend to be built first: `cd client/web && npm run build`.
# Opt-in so a plain `cargo build` does not depend on the frontend being built.
embed-ui = ["web", "dep:rust-embed"]

[dependencies]
ash        = "0.38"
ash-window = "0.13"
bytemuck   = { version = "1", features = ["derive"] }
cosmic-text          = "0.12"
epaint_default_fonts = "0.34.2"
egui       = "0.34.2"
egui-winit = "0.34.2"
env_logger = "0.11"
bitflags   = "2"
anyhow     = "1"
indexmap   = { version = "2", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
lyon_tessellation = "1.0"
log        = "0.4"
prost      = "0.13"
# No `version` requirement: that field only matters when publishing to
# crates.io, and it would have to track the workspace's 0.0.0 sentinel.
vtl        = { path = "../vtl", features = ["serde"] }
nvml-wrapper = "0.10"
rand         = "0.10.1"
uuid         = { version = "1", features = ["v4", "serde"] }
sysinfo      = "0.30"
tokio      = { version = "1", features = ["rt", "sync", "time"] }
winit      = "=0.30.13"
zeromq     = "0.4"
axum         = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
rust-embed   = { version = "8", features = ["mime-guess"], optional = true }
png = "0.18.1"

# Linux-only dependencies for DRM/console mode and Wayland support
[target.'cfg(target_os = "linux")'.dependencies]
drm             = "0.15"
input           = "0.9"
libc            = "0.2"
sd-notify       = "0.4"
wayland-backend = "=0.3.12"
wayland-client  = "=0.31.12"
wayland-sys     = "=0.31.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
prost-build = "0.13"
naga        = { version = "23", features = ["wgsl-in", "spv-out"] }

[package.metadata.deb]
name              = "braemons-vstimd"
maintainer        = "Joscha Schmiedt <joscha@schmiedt.dev>"
depends           = "$auto, libvulkan1, adduser"
recommends        = "vulkan-tools, avahi-daemon"
# Deliberately Suggests, not Recommends: apt installs Recommends by default,
# which would put an SMB daemon on every rig with no vstimd shares configured
# (the stanzas ship as an example — see packaging/samba/vstimd-shares.conf) —
# two open ports for no functional gain. Avahi is a Recommends because the
# package *does* wire it up: vstimd-set-hostname renders its service file.
# Just samba: Ubuntu's libpam-smbpass (the usual way to push a Unix password
# change into Samba's passdb) does not exist in Debian at all, so suggesting it
# would point Debian/Raspberry Pi OS users at an uninstallable package. The
# portable pam_exec(8) equivalent is in the appliance-setup docs.
suggests          = "samba"
section           = "science"
priority          = "optional"
extended-description = """\
vstimd drives a display directly via VK_KHR_display without a compositor, \
providing sub-millisecond frame timing for psychophysics experiments.\n\
Communicates via ZMQ (port 5555) using a protobuf protocol. Supports \
Jetson Orin Nano, Raspberry Pi 4/5, and desktop NVIDIA/AMD GPUs."""
assets = [
    ["target/release/vstimd",                    "usr/bin/vstimd",                                             "755"],
    ["../packaging/sysusers/vstimd.conf",         "usr/lib/sysusers.d/vstimd.conf",                            "644"],
    ["../packaging/rsyslog/vstimd.conf",          "etc/rsyslog.d/10-vstimd.conf",                              "644"],
    ["../packaging/logrotate/vstimd",             "etc/logrotate.d/vstimd",                                    "644"],
    ["../packaging/scripts/vstimd-set-hostname",  "usr/sbin/vstimd-set-hostname",                              "755"],
    # postinst/postrm invoke this; without it the "Boot to vstimd" entry is
    # silently never registered on .deb installs.
    ["../packaging/scripts/vstimd-boot-entry",    "usr/sbin/vstimd-boot-entry",                                "755"],
    # cargo-deb's systemd-units handling only picks up units named after the
    # package (vstimd.service/.target), so this one has to ship as an asset.
    ["../packaging/systemd/vstimd-hostname.service", "usr/lib/systemd/system/vstimd-hostname.service",         "644"],
    ["../packaging/avahi/vstimd.service.tmpl",    "usr/share/braemons/vstimd/vstimd.service.avahi.tmpl",       "644"],
    # Inert until an admin adds the `include =` line to smb.conf; see the file.
    ["../packaging/samba/vstimd-shares.conf",     "usr/share/braemons/vstimd/vstimd-shares.conf",              "644"],
    ["config/default-rig-config.toml",           "etc/braemons/vstimd-rig-config.toml",                       "644"],
    ["config/jetson-orin-nano.toml",             "usr/share/braemons/vstimd/jetson-orin-nano.toml",           "644"],
    ["config/raspberry-pi-5.toml",               "usr/share/braemons/vstimd/raspberry-pi-5.toml",             "644"],
    ["config/raspberry-pi-4.toml",               "usr/share/braemons/vstimd/raspberry-pi-4.toml",             "644"],
]
maintainer-scripts = "../packaging/debian/"

[package.metadata.deb.systemd-units]
unit-scripts = "../packaging/systemd/"
