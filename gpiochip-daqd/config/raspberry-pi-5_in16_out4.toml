vtl_bank  = 0
vtl_bit   = 23
gpio_line = 11          # header pin 23, GPIO11
edge      = "both"

[[inputs]]
name      = "in_pin24"
vtl_bank  = 0
vtl_bit   = 24
gpio_line = 8           # header pin 24, GPIO8
edge      = "both"

[[inputs]]
name      = "in_pin26"
vtl_bank  = 0
vtl_bit   = 26
gpio_line = 7           # header pin 26, GPIO7
edge      = "both"

[[inputs]]
name      = "in_pin29"
vtl_bank  = 0
vtl_bit   = 29
gpio_line = 5           # header pin 29, GPIO5
