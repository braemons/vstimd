[package]
name    = "vsplat"
# Sentinel inherited from the workspace; the shipped version comes from the git
# tag. See [workspace.package] in the root Cargo.toml.
version.workspace = true
edition = "2024"
description = "Gaussian splat scene files and CPU sorting, shared by vstimd and vstimd-reconstruct"
license = "AGPL-3.0-only"
repository = "https://github.com/braemons/vstimd"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam     = "0.33"
log      = "0.4"
