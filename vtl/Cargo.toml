[package]
name    = "vtl"
# Sentinel inherited from the workspace; the shipped version comes from the git
# tag. See [workspace.package] in the root Cargo.toml.
version.workspace = true
edition = "2024"
description = "Virtual Trigger Line shared-memory interface for vstimd"
license = "AGPL-3.0-only"
repository = "https://github.com/braemons/vstimd"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[[example]]
name = "vtl-test-client"
